<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Art portfolio</title>
<script type="importmap">{"imports":{"three":"./lib/r164/three.module.js","three/addons/":"./lib/r164/addons/"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=sunset7">
</head>
<body>
<header class="bar">
  <nav class="side left main" aria-label="Main">
    <a href="#about" data-go="about">About</a>
    <a href="#gallery" data-go="gallery">Gallery</a>
    <a href="#xr" data-go="xr">Extended reality</a>
  </nav>
  <a class="brand" href="#home" id="brand"></a>
  <nav class="side right contact" id="links" aria-label="Contact"></nav>
</header>

<main id="track">
  <section id="home" class="page home" aria-label="Home">
    <div id="stage" aria-hidden="true"></div>
    <div id="spots"></div>
    <div class="hero-text"><h1 id="artist"></h1></div>
    <div class="subs" id="subs" aria-live="polite"></div>
    <a class="next-page" href="#about">About &rarr;</a>
    <noscript><p class="hero-text">This site needs JavaScript to show the 3D piece.</p></noscript>
  </section>

  <section id="about" class="page about-page" aria-label="About">
    <div class="inner">
      <h2><i>01</i>About</h2>
      <p class="lead" id="lead"></p>
      <div class="photos" id="photos"></div>
      <div class="body" id="about-text"></div>
      <ul class="press" id="press"></ul>
      <footer class="foot"></footer>
    </div>
    <a class="next-page" href="#gallery">Gallery &rarr;</a>
  </section>

  <section id="gallery" class="page gallery-page" aria-label="Gallery">
    <div class="inner">
      <h2><i>02</i>Gallery</h2>
      <div class="grid" id="grid"></div>
      <footer class="foot"></footer>
    </div>
    <a class="next-page" href="#xr">Extended reality &rarr;</a>
  </section>

  <section id="xr" class="page xr-page" aria-label="Extended reality">
    <div class="inner">
      <h2><i>03</i>Extended reality</h2>
      <p class="lede">Each piece has its own page. Turn it around, hang it on a wall with your camera, or place it in the room.</p>
      <div class="ar-grid" id="argrid"></div>
      <footer class="foot"></footer>
    </div>
    <a class="next-page" href="#home">Back to start &rarr;</a>
  </section>
</main>

<div class="overlay" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Artwork">
  <button class="x" data-close aria-label="Close">Close</button>
  <button class="nav prev" aria-label="Previous">‹</button>
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  <button class="nav next" aria-label="Next">›</button>
</div>

<script type="module" src="main.js?v=sunset7"></script>
</body>
</html>
