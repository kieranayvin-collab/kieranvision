<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage" aria-hidden="true"></div>
<div id="spots"></div>

<header class="bar">
  <a class="brand" href="#home" id="brand"></a>
  <nav aria-label="Main">
    <a href="#gallery">Gallery</a>
    <a href="#ar">Augmented reality</a>
    <a href="#about">About</a>
  </nav>
</header>

<main>
  <section id="home" class="hero">
    <div class="hero-text">
      <h1 id="artist"></h1>
      <p id="tagline"></p>
    </div>
    <noscript><p class="hero-text">This site needs JavaScript to show the 3D piece.</p></noscript>
  </section>

  <section id="gallery" class="panel">
    <h2>Gallery</h2>
    <div class="grid" id="grid"></div>
  </section>

  <section id="ar" class="panel">
    <h2>Augmented reality</h2>
    <p class="lede">Open a piece to turn it around, or place it in the room you're standing in.</p>
    <div class="ar-grid" id="argrid"></div>
  </section>

  <section id="about" class="panel about">
    <img id="portrait" alt="" hidden>
    <div>
      <h2>About</h2>
      <div id="about-text"></div>
      <p class="links" id="about-links"></p>
    </div>
  </section>
</main>

<div class="overlay" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Artwork">
  <button class="x" data-close aria-label="Close">Close</button>
  <button class="nav prev" aria-label="Previous">‹</button>
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  <button class="nav next" aria-label="Next">›</button>
</div>

<div class="overlay" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Augmented reality piece">
  <button class="x" data-close aria-label="Close">Close</button>
  <div id="v-canvas"></div>
  <div class="v-info">
    <h3 id="v-title"></h3>
    <p id="v-note"></p>
    <button id="v-ar" class="blob-btn" hidden>View in your space</button>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
