<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {GLTFGoogleTiltBrushMaterialExtension} from './lib/ob-core.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(600,600);r.setClearColor(0x0b1230,1);document.body.append(r.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,100);cam.position.set(0,0,6.2);
const l=new GLTFLoader();l.register(p=>new GLTFGoogleTiltBrushMaterialExtension(p,new URL('./brushes/',location.href).href));
l.load(new URLSearchParams(location.search).get('f'),g=>{const b=new THREE.Box3().setFromObject(g.scene),c=b.getCenter(new THREE.Vector3()),s=3.6/Math.max(...b.getSize(new THREE.Vector3()).toArray());g.scene.position.sub(c);const G=new THREE.Group();G.add(g.scene);G.scale.setScalar(s);G.rotation.y=.5;G.rotation.x=.1;sc.add(G);window.ok=1},undefined,e=>{window.fail=String(e)});
r.setAnimationLoop(()=>r.render(sc,cam));
</script>
